name: '🚀 Flutter CI'

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# A new push to a PR makes its previous run worthless, so cancel it. Runs on
# main are left alone: each merge should get its own verdict.
concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: 'Install Flutter'
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 'Install Dependencies'
        run: flutter pub get

      - name: 'Generate Localization'
        run: flutter gen-l10n

      - name: 'Static Analysis'
        run: flutter analyze

  test:
    name: Test (shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@v4

      - name: 'Install Flutter'
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 'Install Dependencies'
        run: flutter pub get

      - name: 'Generate Localization'
        run: flutter gen-l10n

      # Sharded by file, not with --total-shards: that flag splits individual
      # tests, so every shard still compiles all ~135 files, and a few files
      # rely on an earlier test in the same file having run first. The
      # screenshot harness is excluded by tag — it writes PNGs and asserts
      # nothing (see dart_test.yaml).
      - name: 'Run Tests'
        run: |
          mapfile -t files < <(find test -name '*_test.dart' | LC_ALL=C sort | awk -v n=3 -v i=${{ matrix.shard }} '(NR - 1) % n == i')
          echo "Shard ${{ matrix.shard }}: ${#files[@]} files"
          flutter test -x screenshots "${files[@]}"
