name: '🚀 Flutter CI'

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# A new push to a PR makes its previous run worthless, so cancel it. Runs on
# main are left alone: each merge should get its own verdict.
concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: 'Verify Windows Store packaging guards'
        run: python3 -m unittest discover -s build_script -p test_windows_store.py

      - name: 'Install Flutter'
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.47.8'
          cache: true

      - name: 'Install Dependencies'
        run: flutter pub get

      - name: 'Generate Localization'
        run: flutter gen-l10n

      # First, because it takes seconds and a later step's failure would skip
      # it. Line width comes from `formatter:` in analysis_options.yaml;
      # gen-l10n reads the same setting, so the regenerated files pass too.
      - name: 'Format'
        run: dart format --output=none --set-exit-if-changed lib test tool

      - name: 'Static Analysis'
        run: flutter analyze

  test:
    name: Test (shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@v4

      - name: 'Install Flutter'
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.47.8'
          cache: true

      - name: 'Install Dependencies'
        run: flutter pub get

      - name: 'Generate Localization'
        run: flutter gen-l10n

      # Sharded by file, not with --total-shards: that flag splits individual
      # tests, so every shard still compiles all ~289 files, and a few files
      # rely on an earlier test in the same file having run first. The
      # screenshot harness is excluded by tag — it writes PNGs and asserts
      # nothing (see dart_test.yaml).
      - name: 'Run Tests'
        run: |
          mapfile -t files < <(find test -name '*_test.dart' | LC_ALL=C sort | awk -v n=3 -v i=${{ matrix.shard }} '(NR - 1) % n == i')
          echo "Shard ${{ matrix.shard }}: ${#files[@]} files"
          flutter test -x screenshots "${files[@]}"

      - name: 'Verify Direct Distribution Policies'
        if: matrix.shard == 0
        run: >-
          flutter test --dart-define=JOYCAI_DIRECT_DISTRIBUTION=true
          test/services/files/directory_access_service_test.dart
          test/services/files/persistent_media_service_test.dart
          test/core/safety_settings_test.dart
          test/services/llm/safety_payload_test.dart
          test/screens/settings/safety_settings_section_test.dart
