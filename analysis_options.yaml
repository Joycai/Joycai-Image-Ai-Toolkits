# This file configures the analyzer, which statically analyzes Dart code to
# check for errors, warnings, and lints.
#
# `flutter analyze` must report zero issues — info level included — before any
# commit. See CLAUDE.md, "Development Rules".

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
    # Generated by `dart tool/merge_l10n.dart && flutter gen-l10n`; 28k lines
    # nobody edits, and a lint on them can only be fixed by changing the
    # generator. The hand-written sources in lib/l10n/src/ are .arb, not Dart.
    - lib/l10n/app_localizations*.dart

include: package:flutter_lints/flutter.yaml

linter:
  rules:
    # --- Guard rails -------------------------------------------------------
    # All of these are already true of every file in lib/ and test/. They are
    # here to keep it that way, not to schedule work: enabling them cost zero
    # edits.
    - always_declare_return_types
    - avoid_unused_constructor_parameters
    - collection_methods_unrelated_type
    - avoid_type_to_string
    - unnecessary_statements
    - use_super_parameters
    - use_string_in_part_of_directives
    - implicit_call_tearoffs
    - unnecessary_library_name

    # --- Consistency -------------------------------------------------------
    # The codebase already followed each of these nearly everywhere; the
    # stragglers were fixed with `dart fix` when the rule went in, so the rule
    # is what stops the two styles from coexisting again.
    - prefer_single_quotes
    - prefer_final_locals
    - unnecessary_breaks
    - unnecessary_parenthesis
    - unnecessary_await_in_return
    - no_literal_bool_comparisons

    # --- Effective Dart ----------------------------------------------------
    # Added by the 2026-09 structure audit, each with its whole backlog fixed
    # in the same change (`dart fix --apply`, and by hand where it has no fix).
    # Not `omit_local_variable_types`: its fix drops the context a declared
    # type gives an initialiser (`final double w = 10` becomes an int, a
    # `tester.widget<T>` loses its T) — 24 compile errors, and silent changes
    # wherever the narrower type still compiles.
    - directives_ordering
    - prefer_relative_imports
    - unnecessary_lambdas
    - prefer_final_in_for_each
    - avoid_multiple_declarations_per_line
    # Const widgets are skipped on rebuild; flutter_lints dropped these as
    # noisy, but here they already held nearly everywhere.
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_const_literals_to_create_immutables
    - use_colored_box
    - use_decorated_box
    # A future dropped on the floor is either a missing `await` or a
    # deliberate fire-and-forget; `unawaited(...)` says which.
    - unawaited_futures
